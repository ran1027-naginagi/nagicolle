<style>
/*
  layout: glass-on-gradient-mesh, single column — blurred color orbs fixed behind frosted cards,
  gradient progress ring as the hero, sticker-style milestone row, pill chip + stepper input form
*/
:root{
  --bg:#fff3ef;
  --surface:255,255,255;
  --surface-a:0.62;
  --ink:#2a1412;
  --ink-soft:#8a6460;
  --red-1:#ff4731;
  --red-2:#d81324;
  --red-deep:#9c0f17;
  --pink-soft:#ffd4df;
  --gold:#ffb24d;
  --line:255,255,255;
  --line-a:0.5;
  --good:#2fa964;
  --orb-1:#ffb199;
  --orb-2:#ff6b4d;
  --orb-3:#ffe29a;
  --shadow:0 18px 40px -16px rgba(194,31,62,.28);
  --font-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  --font-body:'Zen Maru Gothic','Hiragino Kaku Gothic ProN',sans-serif;
  --font-num:'Zen Maru Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#160c0e;
    --surface:40,20,22;
    --surface-a:0.55;
    --ink:#fbe9ea;
    --ink-soft:#c99b9a;
    --red-1:#ff6a47;
    --red-2:#ff3344;
    --red-deep:#ff8373;
    --pink-soft:#4a2230;
    --gold:#ffc876;
    --line:255,255,255;
    --line-a:0.08;
    --good:#73e0a0;
    --orb-1:#5a2030;
    --orb-2:#4a1c18;
    --orb-3:#402616;
    --shadow:0 18px 44px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#160c0e;
  --surface:40,20,22;
  --surface-a:0.55;
  --ink:#fbe9ea;
  --ink-soft:#c99b9a;
  --red-1:#ff6a47;
  --red-2:#ff3344;
  --red-deep:#ff8373;
  --pink-soft:#4a2230;
  --gold:#ffc876;
  --line:255,255,255;
  --line-a:0.08;
  --good:#73e0a0;
  --orb-1:#5a2030;
  --orb-2:#4a1c18;
  --orb-3:#402616;
  --shadow:0 18px 44px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);
  padding-inline:16px;padding-block:24px 60px;
  -webkit-font-smoothing:antialiased;
  position:relative;overflow-x:hidden;
}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none}
.orb-a{width:280px;height:280px;background:var(--orb-1);top:-100px;left:-80px}
.orb-b{width:260px;height:260px;background:var(--orb-2);top:220px;right:-100px}
.orb-c{width:240px;height:240px;background:var(--orb-3);bottom:-60px;left:10%}

.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.stardots{
  display:flex;align-items:center;gap:6px;justify-content:center;
  color:var(--red-2);opacity:.6;font-size:13px;letter-spacing:4px;
}

header.top{text-align:center;display:flex;flex-direction:column;gap:7px}
.eyebrow{
  display:inline-flex;align-self:center;align-items:center;gap:6px;
  font-size:11px;letter-spacing:.14em;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--red-1),var(--red-2));
  padding:5px 14px;border-radius:999px;box-shadow:var(--shadow);
}
h1{
  font-family:var(--font-display);
  margin:4px 0 0;font-size:28px;font-weight:900;line-height:1.3;
  text-wrap:balance;
}
h1 .card-name{
  background:linear-gradient(135deg,var(--red-1),var(--red-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{margin:0;font-size:12.5px;color:var(--ink-soft)}

.card{
  background:rgba(var(--surface),var(--surface-a));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(var(--line),var(--line-a));
  border-radius:26px;
  padding:22px;
  box-shadow:var(--shadow);
}

.hero{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.ring-wrap{position:relative;width:196px;height:196px}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:rgba(var(--line),.6);stroke-width:16}
.ring-fill{fill:none;stroke:url(#ringGrad);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.22,1,.36,1)}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.ring-count{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:42px;font-weight:900;
  background:linear-gradient(135deg,var(--red-1),var(--red-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
.ring-total{font-size:13px;color:var(--ink-soft);font-weight:700}

.milestones{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;padding-top:2px}
.milestone{
  position:relative;

.milestone:nth-child(odd){transform:rotate(-2deg)}
.milestone:nth-child(even){transform:rotate(2deg)}
.milestone .num{font-size:10.5px;color:var(--ink-soft);font-weight:700}
.milestone .need{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:900}
.milestone.done{background:linear-gradient(160deg,var(--good),#1f8a52);color:#fff}
.milestone.done .num,.milestone.done .need{color:#fff}
.milestone.active{
  background:linear-gradient(160deg,var(--red-1),var(--red-2));
  color:#fff;box-shadow:0 10px 22px -10px rgba(255,45,107,.55);
  transform:scale(1.08) rotate(0deg);
}

.milestone .star{font-size:15px;line-height:1}

.redeem-btn{
  display:none;
  width:100%;margin-top:4px;
  background:linear-gradient(135deg,var(--red-1),var(--red-2));color:#fff;border:none;border-radius:999px;
  padding:16px;font-family:var(--font-display);font-weight:800;font-size:14.5px;
  cursor:pointer;box-shadow:0 14px 28px -12px rgba(255,45,107,.6);
  letter-spacing:.01em;
}
.redeem-btn:active{transform:translateY(1px) scale(.99)}
.redeem-btn.show{display:block}

.section-title{
  font-family:var(--font-display);font-weight:800;font-size:14px;

}
.section-title .bullet{
  width:7px;height:7px;border-radius:50%;

}

.pace-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pace-item{
  position:relative;overflow:hidden;
  background:rgba(var(--line),.35);
  border-radius:18px;padding:14px;text-align:center;
  display:flex;flex-direction:column;gap:2px;min-width:0;
}
.pace-item::before{
  content:"";position:absolute;inset:0;opacity:.14;
  background:linear-gradient(135deg,var(--red-1),var(--gold));
}
.pace-item > *{position:relative}
.pace-item .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:900;font-size:19px;color:var(--red-deep)}
.pace-item .l{font-size:10.5px;color:var(--ink-soft);font-weight:600}

form.add{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
label{font-size:11px;color:var(--ink-soft);font-weight:700;letter-spacing:.02em}

.stepper{
  display:flex;align-items:center;gap:12px;
  background:rgba(var(--line),.35);border-radius:999px;padding:6px;
}
.stepper button{
  flex:none;width:38px;height:38px;border-radius:50%;border:none;
  background:rgba(var(--surface),.9);color:var(--red-deep);font-size:18px;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.stepper button:active{transform:scale(.92)}
.stepper input{
  flex:1;text-align:center;border:none;background:transparent;
  font-family:var(--font-num);font-variant-numeric:tabular-nums;
  font-size:20px;font-weight:900;color:var(--ink);width:100%;min-width:0;
}
.stepper input:focus{outline:none}

.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  padding:9px 14px;border-radius:999px;border:1px solid rgba(var(--line),.6);
  background:rgba(var(--line),.3);font-size:12.5px;font-weight:700;color:var(--ink-soft);
  cursor:pointer;
}
.chip.sel{
  background:linear-gradient(135deg,var(--red-1),var(--red-2));
  border-color:transparent;color:#fff;
}

input[type="date"]{
  width:100%;font-family:var(--font-body);font-size:14px;font-weight:700;
  border:1px solid rgba(var(--line),.6);border-radius:14px;padding:11px 14px;
  background:rgba(var(--line),.3);color:var(--ink);
}
input[type="date"]:focus{outline:2px solid var(--red-1);outline-offset:1px}

.submit{
  background:linear-gradient(135deg,var(--red-1),var(--red-2));color:#fff;border:none;
  border-radius:999px;padding:14px;font-weight:800;font-family:var(--font-display);font-size:14.5px;
  cursor:pointer;box-shadow:0 14px 28px -12px rgba(255,45,107,.55);
}
.submit:disabled{opacity:.5}
.submit:active{transform:translateY(1px) scale(.99)}

.log{display:flex;flex-direction:column;gap:0;max-height:300px;overflow-y:auto;overflow-x:hidden}
.log-row{
  display:flex;align-items:center;gap:10px;padding:11px 4px;
  border-bottom:1px solid rgba(var(--line),.5);
}
.log-row:last-child{border-bottom:none}
.log-badge{
  flex:none;width:32px;height:32px;border-radius:12px;
  background:linear-gradient(135deg,var(--red-1),var(--gold));opacity:.9;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.log-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.log-src{font-size:13px;font-weight:700}
.log-date{font-size:11px;color:var(--ink-soft)}
.log-amt{flex:none;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:900;color:var(--red-deep);font-size:15px}
.log-empty{padding:22px 0;text-align:center;color:var(--ink-soft);font-size:13px}

.log-del{
  flex:none;border:none;background:rgba(var(--line),.5);color:var(--ink-soft);
  font-size:11px;font-weight:700;border-radius:999px;padding:6px 10px;cursor:pointer;
  white-space:nowrap;
}
.log-del.armed{background:linear-gradient(135deg,var(--red-1),var(--red-2));color:#fff}

.redeem-row .log-badge{background:linear-gradient(135deg,var(--good),#1f8a52);opacity:1}
.redeem-row .log-amt{color:var(--good)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;
  font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s ease;
  z-index:50;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);
}
.toast.show{opacity:1}

.foot{text-align:center;font-size:11px;color:var(--ink-soft);padding-top:2px}
</style>

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="orb orb-c"></div>

<div class="wrap">
  <header class="top">
    <div class="stardots">✦ ✦ ✦</div>
    <div class="eyebrow">★ 完凸トラッカー</div>
    <h1>「<span class="card-name">夜明けを歌う白</span>」<br>乱凪砂</h1>
    <p class="sub">『SS』編／Final Stage『SS』報酬カード・メモリアルコインのみで集める</p>
  </header>

  <div class="card hero">
    <div class="ring-wrap">
      <svg viewBox="0 0 196 196">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="var(--red-1)"/>
            <stop offset="100%" stop-color="var(--red-2)"/>
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="98" cy="98" r="82"></circle>
        <circle id="ringFill" class="ring-fill" cx="98" cy="98" r="82" stroke-dasharray="515" stroke-dashoffset="515"></circle>
      </svg>
      <div class="ring-center">
        <div class="ring-count" id="stockNum">–</div>
        <div class="ring-total" id="stockTarget">/ 70枚</div>
        <div class="ring-label">現在のメモリアルコイン</div>
      </div>
    </div>

    <div class="milestones" id="milestoneRow"></div>

    <button class="redeem-btn" id="redeemBtn">この枚数で交換する ✦ 次の1枚へ</button>
  </div>

  <div class="card">
    <div class="section-title"><span class="bullet"></span>完凸までの見通し</div>
    <div class="pace-grid">
      <div class="pace-item">
        <div class="v" id="paceOwned">1 / 5</div>
        <div class="l">所持カード枚数</div>
      </div>
      <div class="pace-item">
        <div class="v" id="paceRemain">–</div>
        <div class="l">完凸まで残りコイン</div>
      </div>
      <div class="pace-item">
        <div class="v" id="paceAvg">–</div>
        <div class="l">月平均ペース</div>
      </div>
      <div class="pace-item">
        <div class="v" id="paceEta">–</div>
        <div class="l">完凸予測</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span class="bullet"></span>コインを記録する</div>
    <form class="add" id="addForm">
      <div class="field">
        <label for="amt">枚数</label>
        <div class="stepper">
          <button type="button" id="stepDown" aria-label="減らす">−</button>
          <input type="number" id="amt" min="1" step="1" value="1" inputmode="numeric" required>
          <button type="button" id="stepUp" aria-label="増やす">＋</button>
        </div>
      </div>
      <div class="field">
        <label>入手元</label>
        <div class="chiprow" id="srcChips">
          <button type="button" class="chip sel" data-v="ツアーイベント">🚗 ツアー</button>
          <button type="button" class="chip" data-v="新曲イベント">🎵 新曲</button>
          <button type="button" class="chip" data-v="スフィアコイン交換">💠 スフィア</button>
          <button type="button" class="chip" data-v="ソロライブ報酬">🎤 ソロライブ</button>
          <button type="button" class="chip" data-v="その他">✦ その他</button>
        </div>
        <input type="hidden" id="src" value="ツアーイベント">
      </div>
      <div class="field">
        <label for="dt">日付</label>
        <input type="date" id="dt">
      </div>
      <button class="submit" type="submit" id="submitBtn">追加する</button>
    </form>
  </div>

  <div class="card">
    <div class="section-title"><span class="bullet"></span>記録</div>
    <div class="log" id="logList">
      <div class="log-empty">読み込み中…</div>
    </div>
  </div>

  <div class="foot">✦ 焦らず、推しのために気長に ✦</div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STATE_KEY = "nagicolle_state_v1";
  var LOG_KEY = "nagicolle_log_v1";

  var MILESTONES = [
    {copy:2, need:70},
    {copy:3, need:80},
    {copy:4, need:90},
    {copy:5, need:120}
  ];

  var state = {
    stockpile: 22,
    copiesOwned: 1
  };
  var logEntries = [];

  function loadState(){
    try{
      var raw = localStorage.getItem(STATE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(typeof parsed.stockpile === "number") state.stockpile = parsed.stockpile;
        if(typeof parsed.copiesOwned === "number") state.copiesOwned = parsed.copiesOwned;
      }
    } catch(e){}
  }
  function saveState(){
    try{
      localStorage.setItem(STATE_KEY, JSON.stringify({stockpile:state.stockpile, copiesOwned:state.copiesOwned}));
    } catch(e){}
  }
  function loadLog(){
    try{
      var raw = localStorage.getItem(LOG_KEY);
      if(raw) logEntries = JSON.parse(raw) || [];
    } catch(e){ logEntries = []; }
  }
  function saveLog(){
    try{ localStorage.setItem(LOG_KEY, JSON.stringify(logEntries)); } catch(e){}
  }

  function srcIcon(s){
    if(s==="ツアーイベント") return "🚗";
    if(s==="新曲イベント") return "🎵";
    if(s==="スフィアコイン交換") return "💠";
    if(s==="ソロライブ報酬") return "🎤";
    return "✦";
  }

  function fmt(n){ return (n==null) ? "–" : n.toLocaleString("ja-JP"); }

  function currentMilestone(){
    var copiesOwned = state.copiesOwned==null?1:state.copiesOwned;
    for(var i=0;i<MILESTONES.length;i++){
      if(MILESTONES[i].copy > copiesOwned) return MILESTONES[i];
    }
    return null; // 完凸済み
  }

  function totalRemainingCoins(){
    var copiesOwned = state.copiesOwned==null?1:state.copiesOwned;
    var stock = state.stockpile||0;
    var remain = 0;
    for(var i=0;i<MILESTONES.length;i++){
      if(MILESTONES[i].copy > copiesOwned) remain += MILESTONES[i].need;
    }
    return Math.max(remain - stock, 0);
  }

  function render(){
    var m = currentMilestone();
    var stock = state.stockpile||0;

    var ring = document.getElementById("ringFill");
    var stockNum = document.getElementById("stockNum");
    var stockTarget = document.getElementById("stockTarget");
    var redeemBtn = document.getElementById("redeemBtn");

    if(m){
      var pct = Math.min(stock / m.need, 1);
      var C = 515;
      ring.setAttribute("stroke-dashoffset", String(C - C*pct));
      stockNum.textContent = fmt(stock);
      stockTarget.textContent = "/ " + m.need + "枚";
      redeemBtn.textContent = (m.copy)+"枚目に交換する ✦ あと" + m.need + "枚のライン";
      redeemBtn.classList.toggle("show", stock >= m.need);
    } else {
      ring.setAttribute("stroke-dashoffset","0");
      stockNum.textContent = "🎉";
      stockTarget.textContent = "完凸達成";
      redeemBtn.classList.remove("show");
    }

    var row = document.getElementById("milestoneRow");
    row.innerHTML = "";
    var copiesOwned = state.copiesOwned==null?1:state.copiesOwned;
    MILESTONES.forEach(function(ms){
      var el = document.createElement("div");
      var done = ms.copy <= copiesOwned;
      var active = m && m.copy === ms.copy;
      el.className = "milestone" + (done?" done":"") + (active?" active":"");
      el.innerHTML = '<div class="star">'+(done?"★":"☆")+'</div>'+
                      '<div class="num">'+ms.copy+'枚目</div>'+
                      '<div class="need">'+ms.need+'</div>';
      row.appendChild(el);
    });

    document.getElementById("paceOwned").textContent = copiesOwned + " / 5";
    document.getElementById("paceRemain").textContent = m ? fmt(totalRemainingCoins()) + "枚" : "達成済み";

    var now = new Date();
    var cutoff = new Date(now.getFullYear(), now.getMonth()-5, 1);
    var recent = logEntries.filter(function(e){
      var d = new Date(e.date);
      return !isNaN(d) && d >= cutoff;
    });
    var monthsSpan = 6;
    var sum = recent.reduce(function(a,e){return a+(e.amount||0);},0);
    var avgPerMonth = recent.length ? (sum / monthsSpan) : null;
    document.getElementById("paceAvg").textContent = avgPerMonth ? (Math.round(avgPerMonth*10)/10)+"枚/月" : "記録を貯め中";

    if(m && avgPerMonth && avgPerMonth > 0){
      var remainMonths = totalRemainingCoins() / avgPerMonth;
      var eta = new Date(now.getFullYear(), now.getMonth() + Math.ceil(remainMonths), 1);
      document.getElementById("paceEta").textContent = eta.getFullYear()+"年"+(eta.getMonth()+1)+"月頃";
    } else {
      document.getElementById("paceEta").textContent = "–";
    }

    var list = document.getElementById("logList");
    if(!logEntries.length){
      list.innerHTML = '<div class="log-empty">まだ記録がないよ。下のフォームから追加してね</div>';
    } else {
      var sorted = logEntries.slice().sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
      list.innerHTML = sorted.map(function(e){
        var isRedeem = e.source === "交換";
        return '<div class="log-row'+(isRedeem?" redeem-row":"")+'">'+
          '<div class="log-badge">'+(isRedeem?"🎴":srcIcon(e.source))+'</div>'+
          '<div class="log-main"><div class="log-src">'+(e.source||"")+(e.note?(" · "+e.note):"")+'</div>'+
          '<div class="log-date">'+(e.date||"")+'</div></div>'+
          '<div class="log-amt">'+(isRedeem?("−"+e.amount):("+"+e.amount))+'</div>'+
          '<button type="button" class="log-del" data-id="'+e._id+'" data-amount="'+e.amount+'" data-redeem="'+(isRedeem?"1":"0")+'">✕</button>'+
        '</div>';
      }).join("");
    }
    attachDeleteHandlers();
  }

  function attachDeleteHandlers(){
    document.querySelectorAll(".log-del").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(btn.dataset.armed === "1"){
          deleteEntry(btn.dataset.id, parseInt(btn.dataset.amount,10), btn.dataset.redeem === "1");
        } else {
          btn.dataset.armed = "1";
          btn.textContent = "本当に消す";
          btn.classList.add("armed");
          setTimeout(function(){
            if(btn.dataset.armed === "1"){
              btn.dataset.armed = "0";
              btn.textContent = "✕";
              btn.classList.remove("armed");
            }
          }, 3000);
        }
      });
    });
  }

  function deleteEntry(id, amount, isRedeem){
    var newStock, newCopies;
    if(isRedeem){
      newCopies = Math.max(1, (state.copiesOwned||1) - 1);
      newStock = (state.stockpile||0) + amount;
    } else {
      newStock = Math.max(0, (state.stockpile||0) - amount);
      newCopies = state.copiesOwned||1;
    }
    state.stockpile = newStock;
    state.copiesOwned = newCopies;
    logEntries = logEntries.filter(function(e){ return e._id !== id; });

    saveState();
    saveLog();
    toast("記録を削除したよ");
    render();
  }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function init(){
    document.getElementById("dt").valueAsDate = new Date();
    loadState();
    loadLog();
    render();
    bindForm();
  }

  function bindForm(){
    var amtInput = document.getElementById("amt");

    document.getElementById("stepUp").addEventListener("click", function(){
      amtInput.value = (parseInt(amtInput.value,10)||0) + 1;
    });
    document.getElementById("stepDown").addEventListener("click", function(){
      amtInput.value = Math.max(1, (parseInt(amtInput.value,10)||1) - 1);
    });

    var chips = document.querySelectorAll("#srcChips .chip");
    var srcHidden = document.getElementById("src");
    chips.forEach(function(chip){
      chip.addEventListener("click", function(){
        chips.forEach(function(c){ c.classList.remove("sel"); });
        chip.classList.add("sel");
        srcHidden.value = chip.getAttribute("data-v");
      });
    });

    document.getElementById("addForm").addEventListener("submit", function(ev){
      ev.preventDefault();
      var amt = parseInt(amtInput.value, 10);
      var src = srcHidden.value;
      var dt = document.getElementById("dt").value;
      if(!amt || amt <= 0) return;

      state.stockpile = (state.stockpile||0) + amt;
      logEntries.push({_id:"e"+Date.now(), amount:amt, source:src, date:dt});
      saveState();
      saveLog();

      amtInput.value = "1";
      toast(amt+"枚 記録したよ ✦");
      render();
    });

    document.getElementById("redeemBtn").addEventListener("click", function(){
      var m = currentMilestone();
      if(!m) return;
      var stock = state.stockpile||0;
      if(stock < m.need) return;

      state.stockpile = stock - m.need;
      state.copiesOwned = m.copy;
      logEntries.push({_id:"r"+Date.now(), amount:m.need, source:"交換", date:new Date().toISOString().slice(0,10), note:m.copy+"枚目"});
      saveState();
      saveLog();

      toast(m.copy+"枚目ゲット！🎴");
      render();
    });
  }

  init();
})();
</script>
